<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างเกียรติบัตรออนไลน์ (Phase 1)</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Font TH Sarabun จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center py-10 px-4 min-h-screen">
    
    <div class="bg-white p-6 rounded-xl shadow-lg text-center w-full max-w-5xl">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">ทดสอบต้นแบบเกียรติบัตร (Canvas)</h2>
        <p class="text-gray-600 mb-4">ระบบจะทำการวาดข้อความทับลงบนรูปภาพพื้นหลัง โดยประมวลผลบนเครื่องของคุณเอง</p>
        
        <!-- เครื่องมือปรับตำแหน่งข้อความ -->
        <div class="mb-6 p-4 bg-indigo-50 border border-indigo-100 rounded-lg text-left shadow-sm">
            <h3 class="font-bold text-indigo-800 mb-3 text-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
                เครื่องมือปรับตำแหน่งข้อความ (5 Blocks)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                        <span>Block 1: ชื่อ-สกุล (Y)</span> <span id="valB1" class="text-indigo-600 font-bold">-140</span>
                    </label>
                    <input type="range" id="b1Y" min="-500" max="500" value="-140" class="w-full accent-indigo-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                        <span>Block 2: ข้อความ 1 (Y)</span> <span id="valB2" class="text-indigo-600 font-bold">-10</span>
                    </label>
                    <input type="range" id="b2Y" min="-500" max="500" value="-10" class="w-full accent-indigo-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                        <span>Block 3: ข้อความ 2 (Y)</span> <span id="valB3" class="text-indigo-600 font-bold">70</span>
                    </label>
                    <input type="range" id="b3Y" min="-500" max="500" value="70" class="w-full accent-indigo-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                        <span>Block 4: วันที่ (Y)</span> <span id="valB4" class="text-indigo-600 font-bold">220</span>
                    </label>
                    <input type="range" id="b4Y" min="-500" max="500" value="220" class="w-full accent-indigo-600">
                </div>
                <div class="col-span-1 md:col-span-2 lg:col-span-2 grid grid-cols-2 gap-4 bg-pink-50 p-3 rounded-lg border border-pink-200">
                    <div>
                        <label class="block text-xs font-medium text-pink-700 mb-1 flex justify-between">
                            <span>Block 5: เลขที่ (แกน X แนวนอน)</span> <span id="valB5X" class="text-pink-700 font-bold">580</span>
                        </label>
                        <input type="range" id="b5X" min="0" max="1000" value="580" class="w-full accent-pink-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-pink-700 mb-1 flex justify-between">
                            <span>Block 5: เลขที่ (แกน Y แนวตั้ง)</span> <span id="valB5Y" class="text-pink-700 font-bold">-370</span>
                        </label>
                        <input type="range" id="b5Y" min="-600" max="600" value="-370" class="w-full accent-pink-600">
                    </div>
                </div>
            </div>
            <p class="text-xs text-indigo-600 mt-3">* Block 1-4 จัดกึ่งกลางอัตโนมัติ (ขยับแค่ขึ้นลง) / Block 5 ขยับได้ทั้งซ้าย-ขวา และ ขึ้น-ลง</p>
        </div>

        <!-- พื้นที่แสดงตัวอย่างเกียรติบัตร -->
        <div class="overflow-auto mb-6 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 p-2">
            <!-- Canvas จะแสดงรูปเกียรติบัตรที่นี่ (ย่อขนาดให้พอดีจอ แต่เวลาโหลดจะความละเอียดเต็ม) -->
            <canvas id="certCanvas" class="max-w-full h-auto mx-auto shadow-md"></canvas>
        </div>
        
        <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 transition-colors text-white text-lg font-bold py-3 px-8 rounded-full shadow-lg flex items-center justify-center mx-auto gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            ดาวน์โหลดเกียรติบัตร (.png)
        </button>
    </div>

    <script>
        // 1. กำหนดข้อมูลจำลอง (Mock Data) 5 Blocks
        const mockData = {
            block1: "นายคมสัน คงเอี่ยม",
            block2: "ผ่านการอบรมเชิงปฏิบัติการ การจัดการเรียนรู้ด้านปัญญาประดิษฐ์",
            block3: "ระดับชั้นประถมศึกษาปีที่ ๔-๖ ประจำปีงบประมาณ พ.ศ. ๒๕๖๙",
            block4: "ให้ไว้ ณ วันที่ ๒ ตุลาคม ๒๕๖๙",
            block5: "เลขที่ ศธ ๐๔๐๔๐/๒๕๖๙"
        };

        const canvas = document.getElementById('certCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        // IMPORTANT: Set crossOrigin BEFORE setting the src to avoid CORS issues when downloading
        img.crossOrigin = "anonymous"; 
        
        // ใส่ URL รูปภาพพื้นหลังที่ฝากไว้บน GitHub
        img.src = "https://gorpor.github.io/ry2-Certificate/bg01.png";

        // ฟังก์ชันสำหรับวาดเกียรติบัตร (แยกออกมาเพื่อให้เรียกซ้ำได้เวลาเลื่อนแถบ Slider)
        function renderCertificate() {
            // ตั้งค่าขนาด Canvas
            canvas.width = img.width;
            canvas.height = img.height;
            
            // วาดรูปพื้นหลัง
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // ดึงค่าการปรับตำแหน่งจาก Slider 
            const b1Y = parseInt(document.getElementById('b1Y').value);
            const b2Y = parseInt(document.getElementById('b2Y').value);
            const b3Y = parseInt(document.getElementById('b3Y').value);
            const b4Y = parseInt(document.getElementById('b4Y').value);
            const b5X = parseInt(document.getElementById('b5X').value);
            const b5Y = parseInt(document.getElementById('b5Y').value);
            
            // อัปเดตตัวเลขที่แสดงบนหน้าจอ
            document.getElementById('valB1').innerText = b1Y;
            document.getElementById('valB2').innerText = b2Y;
            document.getElementById('valB3').innerText = b3Y;
            document.getElementById('valB4').innerText = b4Y;
            document.getElementById('valB5X').innerText = b5X;
            document.getElementById('valB5Y').innerText = b5Y;

            // ตั้งค่าจุดอ้างอิงตรงกลาง
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2; 

            // วาด Block 1: ชื่อ-สกุล (Center)
            ctx.textAlign = "center"; 
            ctx.font = "bold 90px 'Sarabun'"; 
            ctx.fillStyle = "#1e3a8a"; 
            ctx.fillText(mockData.block1, centerX, centerY + b1Y); 
            
            // วาด Block 2: ข้อความชุดที่ 1 (Center)
            ctx.font = "500 50px 'Sarabun'";
            ctx.fillStyle = "#374151"; 
            ctx.fillText(mockData.block2, centerX, centerY + b2Y);

            // วาด Block 3: ข้อความชุดที่ 2 (Center)
            ctx.fillText(mockData.block3, centerX, centerY + b3Y);

            // วาด Block 4: วันที่ (Center)
            ctx.font = "400 45px 'Sarabun'";
            ctx.fillStyle = "#4b5563"; 
            ctx.fillText(mockData.block4, centerX, centerY + b4Y);

            // วาด Block 5: เลขที่ (Right Aligned)
            ctx.textAlign = "right"; // จัดชิดขวา
            ctx.font = "bold 40px 'Sarabun'";
            ctx.fillStyle = "#1f2937"; 
            // อ้างอิงจากตรงกลางภาพ บวกกับค่า X ที่ปรับได้
            ctx.fillText(mockData.block5, centerX + b5X, centerY + b5Y);
        }

        // 2. เมื่อรูปโหลดเสร็จ ให้ทำการวาด (Render)
        img.onload = function() {
            // รอให้ฟอนต์โหลดเสร็จสมบูรณ์ก่อน เพื่อป้องกันปัญหาตัวอักษรกลายเป็น Arial ในการโหลดครั้งแรก
            document.fonts.ready.then(function() {
                renderCertificate();
            });
        };

        // ผูก Event Listener ให้กับ Slider เมื่อมีการเลื่อน (input) ให้วาดเกียรติบัตรใหม่ทันที
        document.getElementById('b1Y').addEventListener('input', renderCertificate);
        document.getElementById('b2Y').addEventListener('input', renderCertificate);
        document.getElementById('b3Y').addEventListener('input', renderCertificate);
        document.getElementById('b4Y').addEventListener('input', renderCertificate);
        document.getElementById('b5X').addEventListener('input', renderCertificate);
        document.getElementById('b5Y').addEventListener('input', renderCertificate);

        // 3. ฟังก์ชันสำหรับกดปุ่มดาวน์โหลด
        document.getElementById('downloadBtn').addEventListener('click', function() {
            try {
                // แปลงสิ่งที่วาดบน Canvas ทั้งหมดให้เป็นข้อมูลรูปภาพ PNG
                const dataURL = canvas.toDataURL('image/png');
                
                // สร้างลิงก์ดาวน์โหลดจำลองแล้วสั่งคลิก
                const link = document.createElement('a');
                link.download = `เกียรติบัตร_${mockData.name}.png`;
                link.href = dataURL;
                link.click();
            } catch (error) {
                console.error("Download failed:", error);
                // หากติดปัญหา CORS (เปิดไฟล์แบบ Local) จะเข้าเงื่อนไขนี้
                alert("เกิดข้อผิดพลาดในการดาวน์โหลด (CORS Error)\n\nกรุณาเปิดไฟล์ HTML นี้ผ่าน Local Server (เช่น Live Server ใน VS Code) หรืออัปโหลดขึ้น GitHub Pages เพื่อให้ระบบความปลอดภัยของเบราว์เซอร์อนุญาตให้ดาวน์โหลดภาพได้ครับ");
            }
        });
        
        // ลบ Event Listener เก่าออก
        
    </script>
</body>
</html>
