<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาและดาวน์โหลดเกียรติบัตรออนไลน์</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Font TH Sarabun จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        
        /* สร้าง Animation สำหรับ Loading Spinner */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        /* ซ่อน Canvas เพราะเราจะวาดอยู่เบื้องหลัง ไม่ต้องแสดงให้ผู้ใช้เห็นตอนใช้งานจริง */
        #certCanvas {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- Header -->
    <header id="appHeader" class="bg-blue-800 text-white py-6 shadow-md transition-colors duration-300">
        <div class="container mx-auto px-4 max-w-6xl flex flex-col md:flex-row items-center justify-between">
            <div class="flex items-center gap-4">
                <!-- โลโก้ (เปลี่ยนเป็นลิงก์รูปภาพที่กำหนด) -->
                <div class="bg-white p-1 rounded-full shadow-sm flex items-center justify-center h-14 w-14 overflow-hidden">
                    <img src="https://lh5.googleusercontent.com/d/11lT0KghZEJcvK8GjV_IHeB3Xz8HqXjNj" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-3xl font-bold">ระบบเกียรติบัตรออนไลน์</h1>
                    <p class="text-blue-200 text-lg">สำนักงานเขตพื้นที่การศึกษาประถมศึกษาระยอง เขต 2</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-6xl">
        
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8 border border-gray-100">
            <!-- Search Bar -->
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">ค้นหารายชื่อผู้รับเกียรติบัตร</h2>
                <div class="relative w-full md:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg placeholder-gray-400" placeholder="พิมพ์ชื่อ-สกุล หรือชื่อกิจกรรม เพื่อค้นหา...">
                </div>
            </div>

            <!-- สถานะกำลังโหลด -->
            <div id="loadingState" class="flex flex-col items-center justify-center py-12">
                <div class="loader mb-4"></div>
                <p class="text-gray-500 text-xl">กำลังดึงข้อมูลจากระบบ กรุณารอสักครู่...</p>
            </div>

            <!-- สถานะ Error -->
            <div id="errorState" class="hidden flex-col items-center justify-center py-12 text-red-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p class="text-xl font-bold" id="errorMessage">เกิดข้อผิดพลาดในการดึงข้อมูล</p>
                <button onclick="fetchData()" class="mt-4 px-6 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition">ลองใหม่อีกครั้ง</button>
            </div>

            <!-- ตารางแสดงข้อมูล -->
            <div id="tableContainer" class="hidden overflow-x-auto rounded-lg border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-4 text-left text-lg font-bold text-gray-700 w-16">ลำดับ</th>
                            <th scope="col" class="px-6 py-4 text-left text-lg font-bold text-gray-700">ชื่อ-สกุล</th>
                            <th scope="col" class="px-6 py-4 text-left text-lg font-bold text-gray-700">กิจกรรม / รางวัล</th>
                            <th scope="col" class="px-6 py-4 text-center text-lg font-bold text-gray-700 w-48">ดำเนินการ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                        <!-- แถวข้อมูลจะถูกเพิ่มด้วย JavaScript ที่นี่ -->
                    </tbody>
                </table>
            </div>
            
            <!-- สถานะไม่พบข้อมูล (ตอนค้นหา) -->
            <div id="noResultState" class="hidden flex-col items-center justify-center py-12 text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p class="text-xl">ไม่พบข้อมูลที่ค้นหา</p>
            </div>
        </div>
    </main>

    <!-- Footer (เพิ่มใหม่ตามคำขอ) -->
    <footer id="appFooter" class="bg-blue-800 text-white py-8 mt-auto shadow-inner transition-colors duration-300">
        <div class="container mx-auto px-4 max-w-6xl text-center md:text-left flex flex-col items-center justify-center">
            <p id="footerTextDisplay" class="text-sm md:text-base leading-relaxed whitespace-pre-line text-blue-50 text-center"></p>
        </div>
    </footer>

    <!-- Canvas สำหรับวาดเกียรติบัตรเบื้องหลัง -->
    <canvas id="certCanvas"></canvas>

    <!-- ระบบแจ้งเตือน (Toast Notification) แทนการใช้ alert() -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // ------------------------------------------------------------------
        // ส่วนการตั้งค่า (Configuration)
        // ------------------------------------------------------------------
        
        // 1. URL ของ Google Apps Script ที่เรา Deploy ไว้
        const API_URL = "https://script.google.com/macros/s/AKfycby5exODhyymg8SMXdvxvsbrRxtOc-IdGBCqE07-PK66mfClAy6tDNrDBimyigY98rr7/exec";
        
        // 2. URL รูปภาพพื้นหลัง (ใช้ภาพเปล่าที่ไม่มีกล่องสีชมพู)
        const BACKGROUND_IMAGE_URL = "https://gorpor.github.io/ry2-Certificate/bg00.png";
        
        // 3. พิกัด (Coordinates) ที่ได้จากการทดสอบใน Phase 1
        const COORD = {
            block1_Y: -169, // ชื่อ-สกุล
            block2_Y: -22,  // ข้อความบรรทัด 1
            block3_Y: 117,  // ข้อความบรรทัด 2
            block4_Y: 309,  // วันที่
            block5_X: 885,  // เลขที่ (แนวนอน)
            block5_Y: -580  // เลขที่ (แนวตั้ง)
        };

        // ตัวแปรเก็บข้อมูล
        let certificateData = []; 
        let appSettings = null; // ตัวแปรเก็บค่า Setting
        let backgroundImage = new Image();
        let isImageLoaded = false;

        // จัดเตรียม Canvas
        const canvas = document.getElementById('certCanvas');
        const ctx = canvas.getContext('2d');

        // ------------------------------------------------------------------
        // ฟังก์ชันช่วยเหลือ (Helper Functions)
        // ------------------------------------------------------------------

        // ฟังก์ชันแปลงเลขเลขอารบิก เป็น เลขไทย
        function convertToThaiNumerals(text) {
            if (!text) return "";
            // ถ้า text ไม่ใช่ string ให้แปลงเป็น string ก่อน
            const str = text.toString();
            const thaiNumbers = ['๐', '๑', '๒', '๓', '๔', '๕', '๖', '๗', '๘', '๙'];
            // ใช้ Regex ค้นหาตัวเลข 0-9 ทั้งหมด แล้วแทนที่ด้วยเลขไทยตาม index
            return str.replace(/\d/g, function(match) {
                return thaiNumbers[match];
            });
        }

        // ฟังก์ชันแสดงกล่องข้อความแจ้งเตือน (Toast)
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            // ตั้งค่าสีตามประเภท (เขียว=สำเร็จ, แดง=ผิดพลาด, ฟ้า=กำลังทำงาน)
            let bgColor = "bg-green-500";
            let icon = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            
            if (type === 'error') {
                bgColor = "bg-red-500";
                icon = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else if (type === 'info') {
                bgColor = "bg-blue-500";
                icon = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            toast.className = `${bgColor} text-white px-6 py-4 rounded-lg shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-x-full opacity-0`;
            toast.innerHTML = `${icon} <span class="text-lg font-medium">${message}</span>`;
            
            toastContainer.appendChild(toast);
            
            // ทำให้ Toast เลื่อนเข้ามา
            setTimeout(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            }, 10);

            // ตั้งเวลาลบ Toast ออกหลังผ่านไป 3.5 วินาที
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);
        }

        // ------------------------------------------------------------------
        // ฟังก์ชันดึงข้อมูลและการแสดงผล
        // ------------------------------------------------------------------

        // โหลดรูปภาพพื้นหลังเตรียมไว้ล่วงหน้าเลย เพื่อให้กดโหลดได้ทันที
        function preloadImage() {
            backgroundImage.crossOrigin = "anonymous";
            backgroundImage.src = BACKGROUND_IMAGE_URL;
            backgroundImage.onload = () => {
                isImageLoaded = true;
                // ตั้งขนาด Canvas เท่ากับรูปจริง
                canvas.width = backgroundImage.width;
                canvas.height = backgroundImage.height;
            };
            backgroundImage.onerror = () => {
                showToast("โหลดรูปภาพพื้นหลังไม่สำเร็จ โปรดตรวจสอบการเชื่อมต่อ", "error");
            }
        }

        // ดึงข้อมูลจาก Google Apps Script
        async function fetchData() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('tableContainer').classList.add('hidden');
            document.getElementById('errorState').classList.add('hidden');
            document.getElementById('noResultState').classList.add('hidden');

            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === "success") {
                    certificateData = result.data;
                    appSettings = result.settings; // รับค่า Setting จาก Sheet

                    // นำ Setting มาปรับใช้กับหน้าเว็บแบบ Real-time
                    if(appSettings) {
                        document.getElementById('appHeader').style.backgroundColor = appSettings.themeColor;
                        document.getElementById('appFooter').style.backgroundColor = appSettings.themeColor;
                        document.getElementById('footerTextDisplay').innerText = appSettings.footerText;
                    }

                    renderTable(certificateData);
                    
                    // ซ่อนสถานะโหลด แสดงตาราง
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('tableContainer').classList.remove('hidden');
                } else {
                    throw new Error(result.error || "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์");
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorMessage').innerText = "ไม่สามารถเชื่อมต่อฐานข้อมูลได้: " + error.message;
            }
        }

        // วาดตารางข้อมูล
        function renderTable(dataToRender) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ""; // ล้างข้อมูลเก่า

            if (dataToRender.length === 0) {
                document.getElementById('tableContainer').classList.add('hidden');
                document.getElementById('noResultState').classList.remove('hidden');
                document.getElementById('noResultState').classList.add('flex');
                return;
            }

            document.getElementById('tableContainer').classList.remove('hidden');
            document.getElementById('noResultState').classList.add('hidden');
            document.getElementById('noResultState').classList.remove('flex');

            dataToRender.forEach((item, index) => {
                // ประกอบคำนำหน้าและชื่อ-สกุล (แก้ไข: เอาช่องว่างระหว่าง prefix และ name ออกเพื่อให้ตัวอักษรติดกัน)
                const fullName = `${item.prefix}${item.name}`.trim();
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 transition-colors";
                
                // สร้างปุ่มดาวน์โหลด โดยผูก Event Listener แบบ inline เพื่อส่ง object ข้อมูลคนนั้นไป
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-lg text-gray-500">${index + 1}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-lg font-medium text-gray-900">${fullName}</td>
                    <td class="px-6 py-4 text-lg text-gray-500">
                        <div class="truncate w-64 md:w-full" title="${item.block2}">${item.block2}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <button onclick='downloadCertificate(${JSON.stringify(item)})' class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-lg font-medium transition-colors shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            ดาวน์โหลด
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ระบบค้นหา
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filteredData = certificateData.filter(item => {
                const fullName = `${item.prefix} ${item.name}`.toLowerCase();
                const activity = item.block2.toLowerCase();
                return fullName.includes(keyword) || activity.includes(keyword);
            });
            renderTable(filteredData);
        });

        // ------------------------------------------------------------------
        // ฟังก์ชันสร้างและดาวน์โหลดเกียรติบัตร (หัวใจหลัก)
        // ------------------------------------------------------------------
        function downloadCertificate(personData) {
            if (!isImageLoaded) {
                showToast("กำลังเตรียมระบบหลังบ้าน กรุณารอสักครู่แล้วกดใหม่...", "info");
                return;
            }

            try {
                showToast(`กำลังสร้างเกียรติบัตรของ ${personData.name}...`, "info");

                // ล้าง Canvas ด้วยการวาดภาพพื้นหลังทับลงไปใหม่
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);

                // หาจุดกึ่งกลาง (Center)
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                // ดึงค่า Setting สีและขนาด Font ถ้าไม่มีให้ใช้ค่าเริ่มต้น
                const fontColor = appSettings ? appSettings.fontColor : "#1e3a8a";
                const sizeOffset = appSettings ? appSettings.fontSizeOffset : 0;

                // -------------------------------------------------------------------
                // เริ่มวาดข้อความ (แปลงเลขไทย + ใช้ Setting จาก Sheet)
                // -------------------------------------------------------------------
                
                // Block 1: ชื่อ-สกุล (จัดกึ่งกลาง)
                const fullName = convertToThaiNumerals(`${personData.prefix}${personData.name}`.trim());
                ctx.textAlign = "center"; 
                // ใช้ Base Size + Offset ที่ผู้ใช้กรอกมา
                ctx.font = `bold ${88 + sizeOffset}px 'Sarabun'`; 
                ctx.fillStyle = fontColor;
                ctx.fillText(fullName, centerX, centerY + COORD.block1_Y);
                
                // Block 2: ข้อความบรรทัด 1 
                const textLine1 = convertToThaiNumerals(personData.block2);
                ctx.font = `500 ${48 + sizeOffset}px 'Sarabun'`;
                ctx.fillStyle = fontColor;
                ctx.fillText(textLine1, centerX, centerY + COORD.block2_Y);

                // Block 3: ข้อความบรรทัด 2 
                const textLine2 = convertToThaiNumerals(personData.block3);
                ctx.font = `500 ${48 + sizeOffset}px 'Sarabun'`;
                ctx.fillStyle = fontColor;
                ctx.fillText(textLine2, centerX, centerY + COORD.block3_Y);

                // Block 4: วันที่ 
                const dateText = convertToThaiNumerals(personData.date);
                ctx.font = `400 ${43 + sizeOffset}px 'Sarabun'`;
                ctx.fillStyle = fontColor; 
                ctx.fillText(dateText, centerX, centerY + COORD.block4_Y);

                // Block 5: เลขที่เกียรติบัตร (จัดชิดขวา)
                const certNumText = convertToThaiNumerals(personData.certNumber);
                ctx.textAlign = "right"; 
                ctx.font = `bold ${38 + sizeOffset}px 'Sarabun'`;
                ctx.fillStyle = fontColor;
                ctx.fillText(certNumText, centerX + COORD.block5_X, centerY + COORD.block5_Y);

                // -------------------------------------------------------------------
                // สั่งดาวน์โหลด
                // -------------------------------------------------------------------
                
                // แปลง Canvas เป็น Base64 Image URL
                const dataURL = canvas.toDataURL('image/png');
                
                // สร้างลิงก์ชั่วคราวเพื่อสั่งคลิกดาวน์โหลด
                const link = document.createElement('a');
                link.download = `เกียรติบัตร_${personData.name}.png`;
                link.href = dataURL;
                document.body.appendChild(link); // Append ก่อนคลิกเพื่อความเข้ากันได้
                link.click();
                document.body.removeChild(link); // ลบทิ้งเมื่อโหลดเสร็จ

                setTimeout(() => {
                    showToast("ดาวน์โหลดสำเร็จ!", "success");
                }, 500);

            } catch (err) {
                console.error("Generate error:", err);
                showToast("เกิดข้อผิดพลาดขณะวาดเกียรติบัตร", "error");
            }
        }

        // เริ่มทำงานเมื่อเปิดหน้าเว็บ
        window.onload = function() {
            // โหลดฟอนต์ให้เสร็จก่อน เพื่อป้องกันตัวอักษรเพี้ยนในการโหลดครั้งแรก
            document.fonts.ready.then(function() {
                preloadImage(); // โหลดรูปพื้นหลัง
                fetchData();    // โหลดข้อมูลจาก Sheet
            });
        };

    </script>
</body>
</html>
